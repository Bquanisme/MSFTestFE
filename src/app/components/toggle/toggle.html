<button
    type="button"
    class="toggle"
    [class.checked]="isChecked()"
    [class.focused]="isFocused"
    (click)="toggleUpdate()"
    (focus)="isFocused = true"
    (blur)="isFocused = false"
>
    <span
        class="toggle-circle"
        [class.focused]="isFocused"
        [class.checked]="isChecked()"
        [style.toggle.active]="background()"
    >
    </span>
</button>
