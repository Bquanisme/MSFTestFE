<main class="app-layout">

  <app-header
    (setIsDrawerOpen)="setIsDrawerOpen()"
  />

  <div
    class="layout"
    [class.sidebar-closed-layout]="!isDrawerOpen()"
  >

    <app-sidebar
      [isDrawerOpen]="isDrawerOpen()"
      (setIsDrawerOpen)="setIsDrawerOpen()"
    />

    <div class="content">

      <div class="router-content">
        <router-outlet />
      </div>

      <app-footer />

    </div>

  </div>

</main>
