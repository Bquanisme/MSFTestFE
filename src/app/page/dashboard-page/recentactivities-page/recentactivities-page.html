    @for (item of recentActivity; track item.id) {
        <div
            class="activity-item"
            >
            <div
                [class]="`activity-icon ` + item.type"
            >
                <mat-icon>{{ item.type }}</mat-icon>
            </div>

            <div class="activity-content">
                <h4>{{item.title}}</h4>

                <p>
                {{item.description}}
                </p>

                <span>
                {{item.time}}
                </span>
            </div>
        </div>
    }
