<div class="dashboard-bottom-card">
    <div class="bottom-card-header">
        <h3>Recent Activity</h3>
    </div>

    <div class="activity-list">

    @for (item of recentActivity; track item.id) {
        <div
            class="activity-item"
            >
            <div
                [class]="`activity-icon-` + item.id"
            >
                <i [class]="item.type"></i>
            </div>

            <div class="activity-content">
                <h4>{{item.title}}</h4>

                <p>
                {{item.description}}
                </p>

                <span>
                {{item.time}}
                </span>
            </div>
        </div>
    }
    </div>

</div>
