<div class="dashboard-bottom-card">

    <div class="bottom-card-header">
    <h3>Top Products</h3>
    </div>

    <div class="products-table-wrapper">
        <div class="products-table-scroll">
            <table class="products-table">
    
                <thead>
                    <tr>
                        <th class="product-col">PRODUCT</th>
                        <th class="sales-col">SALES</th>
                        <th class="revenue-col">REVENUE</th>
                        <th class="status-col">STATUS</th>
                    </tr>
                </thead>
                <tbody>
    
                @for (product of topProducts; track product.id) {
                <tr>
    
                    <td>
                        <div class="product-info">
                            <div
                                [class]="`product-icon-` + product.id"
                            >
    
                                <i [class]="product.type"></i>
                            
                            </div>
                        <span class="span-name">{{product.name}}</span>
                        </div>
                    </td>
    
                    <td class="span-name">
                        {{product.sales}}
                    </td>
    
                    <td class="span-name">
                        ${{product.revenue.toLocaleString()}}
                    </td>
    
                    <td>
                        <span
                            [class]="
                                product.status === 'In Stock'
                                ? 'product-status in-stock'
                                : 'product-status low-stock'
                            "
                            >
                            {{ product.status }}
                        </span>
                    </td>
    
                </tr>
                }
                </tbody>
    
            </table>
        </div>
    </div>

</div>
