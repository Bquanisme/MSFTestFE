<div class="dashboard-section">
    <div class="dashboard-cards">
    @for (item of dashboard; track item.id) {

    <div
        [class]="'dashboard-card dashboard-card-' + item.id"
    >

        <div class="dashboard-card-content">

            @if ($index === 0) {

                <h2 class="dashboard-card-cost">
                    ${{ item.cost | number:'1.2-2' }}
                </h2>

            } @else if ($index === 3) {

                <h2 class="dashboard-card-cost">
                {{ item.cost }}%
                </h2>

            } @else {

                <h2 class="dashboard-card-cost">
                {{ item.cost.toLocaleString() }}
                </h2>

            }

            <p class="dashboard-card-title">
                {{ item.title }}
            </p>

            <div class="dashboard-card-change">
                @if (item.isIncrease) {
                    <i class="fa-solid fa-arrow-up" style="font-size: 10px;"></i>
                }
                @else {
                    <i class="fa-solid fa-arrow-down" style="font-size: 10px;"></i>
                }

                <span>{{item.percent}}</span>
            </div>

        </div>

        <div class="dashboard-card-icon">
            <i [class]="item.icon"></i>
        </div>

    </div>

    }

    </div>

<!-- 
    <DashboardCharts /> -->
    <app-dashboard-chart-page></app-dashboard-chart-page>

    
    <div class="dashboard-bottom">
        <app-recentactivities-page></app-recentactivities-page>
        <app-topproducts-page></app-topproducts-page>
    </div>

</div>
